<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <div class="form-container" id="regFormContainer">
    <h2>Создать пользователя</h2>

    <form id="cyberForm" >
        <div class="input-group">
            <label>Логин</label>
            <input type="text" id="username">
            <div class="error-msg" id="userError">Минимум 3 символа</div>
            </div>
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email">
            <div class="error-msg" id="emailError">Некорректный адрес</div>
        </div>
        <div class="input-group">
            <label>Пароль</label>
            <input type="password" id="password">
            <div class="error-msg" id="passwordError">Минимум 8 символов</div>
        </div>
        <div class="input-group">
            <label>Подтверждение пароля</label>
            <input type="password" id="confirmPassword">
            <div class="error-msg" id="confirmdError">Пароли не совпадают</div>
        </div>

        <label>Выберите аватар:</label>
        <div class="avatar-selection">
            <label>
                <input type="radio" name="avatar" value="😈" checked>
                <div class="avatar-option">😈</div>
            </label>
            <label>
                <input type="radio" name="avatar" value="🍌">
                <div class="avatar-option">🍌</div>
            </label>
            <label>
                <input type="radio" name="avatar" value="⛔">
                <div class="avatar-option">⛔</div>
            </label>
            <label>
                <input type="radio" name="avatar" value="🎮" >
                <div class="avatar-option">🎮</div>
            </label>
        </div>
        <button type="submit" id="submitBtn" disabled>Регистрация</button>
    </form>
</div>
<div class="success-screen" id="successScreen">
        <h1>Регистрация прошла успешно!</h1>
        <p style="color: #fff;font-size: 1.2rem;">Добро пожаловать в систему, <span id="successName" style="color: var(--neon-blue);"></span></p>
</div>

    

</body>
<script src="js/main.js"></script>

</html>
